<!doctype html>
<!-- Diagnóstico temporal de móvil (24 oct 2026). NO se despliega: se borra al terminar.
     Mete la web en un iframe de 390 px y lista lo que desborda, para no arreglar a ojo. -->
<html lang="es">
  <head><meta charset="utf-8" /><title>debug móvil</title></head>
  <body style="margin:0;background:#111;color:#eee;font:12px monospace">
    <iframe id="f" src="" style="width:390px;height:844px;border:0"></iframe>
    <pre id="out">midiendo…</pre>
    <script>
      const out = document.getElementById('out');
      const f = document.getElementById('f');
      const ruta = new URLSearchParams(location.search).get('ruta') || '/';
      f.src = ruta;
      f.addEventListener('load', () => {
        setTimeout(() => {
          try {
            const d = f.contentDocument;
            const ancho = f.contentWindow.innerWidth;
            const doc = d.documentElement;
            const anchos = [...d.querySelectorAll('*')]
              .map((el) => ({
                sel: el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.split(' ').filter(Boolean).join('.') : ''),
                w: Math.round(el.getBoundingClientRect().width),
                right: Math.round(el.getBoundingClientRect().right),
              }))
              .filter((x) => x.right > ancho + 1)
              .sort((a, b) => b.right - a.right)
              .slice(0, 15);
            out.textContent =
              'viewport=' + ancho +
              ' scrollWidth=' + doc.scrollWidth +
              ' clientWidth=' + doc.clientWidth +
              '\nDESBORDAN (' + anchos.length + '):\n' +
              anchos.map((x) => '  ' + x.right + 'px  anchura=' + x.w + '  ' + x.sel.slice(0, 90)).join('\n');
          } catch (e) {
            out.textContent = 'error: ' + e.message;
          }
        }, 1200);
      });
    </script>
  </body>
</html>
